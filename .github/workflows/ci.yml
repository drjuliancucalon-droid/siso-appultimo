name: CI — Tests + Build
on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Test summary
        if: always()
        run: echo "✅ Tests + Build completed"
